name: Android CI

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build release APK
        run: ./gradlew --no-daemon --build-cache :app:assembleRelease

      - name: Sign APK with configured release key
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign --ks "$RUNNER_TEMP/release.jks" --ks-pass "pass:$KEYSTORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out app/build/outputs/apk/release/gerai-go-release.apk "$APK"

      - name: Sign installable APK for CI artifact
        if: ${{ env.KEYSTORE_B64 == '' }}
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/ci.jks" -storepass android -alias gerai-go -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Gerai Go CI"
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign --ks "$RUNNER_TEMP/ci.jks" --ks-pass pass:android --ks-key-alias gerai-go --key-pass pass:android --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out app/build/outputs/apk/release/gerai-go-release.apk app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Verify v1, v2, and v3 signatures
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/release/gerai-go-release.apk

      - name: Prepare versioned APK and generate zero-emoji release notes
        run: |
          VERSION=$(grep "versionName" app/build.gradle.kts | head -n 1 | awk -F '"' '{print $2}')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          cp app/build/outputs/apk/release/gerai-go-release.apk "app/build/outputs/apk/release/gerai-go-v${VERSION}.apk"
          python3 .github/scripts/generate_release_notes.py \
            --tag "v${VERSION}" \
            --apk-dir "app/build/outputs/apk/release" \
            --repo "${{ github.repository }}" \
            --output "RELEASE_NOTES.md"

      - name: Publish versioned release to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Gerai Go v${{ env.APP_VERSION }}
          body_path: RELEASE_NOTES.md
          files: app/build/outputs/apk/release/gerai-go-*.apk
          make_latest: true

      - name: Update ci-latest rolling release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-latest
          name: Gerai Go CI APK
          body_path: RELEASE_NOTES.md
          files: app/build/outputs/apk/release/gerai-go-*.apk
          overwrite_files: true
