name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: sdkmanager "build-tools;35.0.0"
      - name: Build release APK
        run: gradle --no-daemon --build-cache :app:assembleRelease
      - name: Sign APK with configured release key
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign --ks "$RUNNER_TEMP/release.jks" --ks-pass "pass:$KEYSTORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" --out app/build/outputs/apk/release/gerai-go-release.apk "$APK"
      - name: Sign installable APK for CI artifact
        if: ${{ env.KEYSTORE_B64 == '' }}
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/ci.jks" -storepass android -alias gerai-go -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Gerai Go CI"
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign --ks "$RUNNER_TEMP/ci.jks" --ks-pass pass:android --ks-key-alias gerai-go --key-pass pass:android --out app/build/outputs/apk/release/gerai-go-ci.apk app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gerai-go-release-apk
          path: app/build/outputs/apk/release/gerai-go-*.apk
          if-no-files-found: error
          retention-days: 30
